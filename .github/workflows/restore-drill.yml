name: Restore drill
# Practice restoring the live database without touching it: back it up, load the backup into a new practice
# database, compare row counts table by table, then delete the practice database and the backup.
# Run by hand: Actions → Restore drill → Run workflow. The report shows table names and counts only (this repo is public).
# Steps for a real restore: docs/restore.md
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restore-drill
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/restore-drill.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
